<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色預覽</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fbe9f1; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
    #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 16px; background: #fff; color: #6b3a57; box-shadow: 0 3px 10px rgba(150, 60, 110, .2); cursor: pointer; font-family: inherit; }
    button.on { background: #ff8fb8; color: #fff; }
    .label { position: fixed; transform: translate(-50%, 0); font-weight: bold; color: #6b3a57; background: rgba(255,255,255,.85); padding: 3px 10px; border-radius: 999px; pointer-events: none; font-size: 15px; }
    .bubble { position: fixed; display: none; transform: translate(-50%, -100%); background: #fff; color: #4a2a3d; padding: 8px 14px; border-radius: 14px; font-size: 16px; white-space: nowrap; box-shadow: 0 3px 10px rgba(150,60,110,.2); pointer-events: none; }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <button data-act="talk">💬 說話</button>
    <button data-act="walk">🚶 走路</button>
    <button data-act="wave">👋 揮手</button>
    <button data-act="jump">⬆️ 跳</button>
    <button data-act="happy">😆 開心</button>
    <button data-act="surprised">😮 驚訝</button>
    <button data-act="spin">🔄 旋轉</button>
  </div>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
